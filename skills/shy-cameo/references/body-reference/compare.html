<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五类身形 · 同屏比较</title><style>body{margin:0;padding:24px;background:#f5f3ef;color:#292724;font:16px/1.6 system-ui}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0 18px}.scroll{overflow-x:auto}.row{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px}figure{margin:0;background:white;border-radius:10px;overflow:hidden}img{display:block;width:100%;height:clamp(320px,62vh,700px);object-fit:contain;background:#e5e1dc}figcaption{padding:12px;text-align:center}@media(max-width:700px){body{padding:12px}.row{grid-template-columns:repeat(5,210px)}img{height:420px}}</style><h1>哪种整体轮廓更接近你？</h1><p>只比较肩、腰、髋的关系。胸部大小、胖瘦、身高另行按需确认；可以组合局部，也可以说都不像。窄屏左右滑动，点击图片放大。</p><div class="scroll"><div class="row"><figure><a href="images/B01-front.png" target="_blank"><img src="images/B01-front.png" alt="B01-front 沙漏形"></a><figcaption><strong>B01 · 沙漏形</strong></figcaption></figure><figure><a href="images/B02-front.png" target="_blank"><img src="images/B02-front.png" alt="B02-front 梨形"></a><figcaption><strong>B02 · 梨形</strong></figcaption></figure><figure><a href="images/B03-front.png" target="_blank"><img src="images/B03-front.png" alt="B03-front 倒三角形"></a><figcaption><strong>B03 · 倒三角形</strong></figcaption></figure><figure><a href="images/B04-front.png" target="_blank"><img src="images/B04-front.png" alt="B04-front 矩形"></a><figcaption><strong>B04 · 矩形</strong></figcaption></figure><figure><a href="images/B05-front.png" target="_blank"><img src="images/B05-front.png" alt="B05-front 苹果形"></a><figcaption><strong>B05 · 苹果形</strong></figcaption></figure></div></div><p>B01 肩髋接近、腰线明显；B02 髋宽于肩；B03 肩宽于髋；B04 腰侧较平直；B05 腰腹较丰满。选中后可继续看侧面或背面。</p></html>
